name: release

# Makes a GitHub release for a version tag (v0.6.0-beta). See
# docs/internals/release.md for the steps and the secrets.
#
# The files of a release (VERSION is the tag with no v):
#   zslice-VERSION-{x86_64,aarch64}-linux-musl.tar.gz  the command line tool
#   zslice-VERSION-{aarch64,x86_64}-macos.tar.gz       the command line tool
#   zslice-VERSION-lib-{aarch64,x86_64}-linux-gnu.tar.gz
#                       the C library (libzslice.a and the headers)
#   zslice-VERSION-macos-universal.dmg  the Mac app, signed and notarized
#                       (-unsigned.dmg with no signing secrets)
#   zslice-gtk-VERSION-linux-{x86_64,aarch64}.tar.gz  the Linux app
#   zslice-VERSION-web.zip                the web app
#   zslice-VERSION-windows-{x64,arm64}.zip  the Windows app, unsigned
#                       (only when windows/ exists)
#   SHA256SUMS          the SHA-256 of each file
# The printdeck Action downloads the Linux tools by their names. Do not
# change the names of the CLI and lib tarballs.
#
# Prereleases:
#   - vX.Y.Z is a release.
#   - vX.Y.Z-beta is a prerelease on GitHub, and updates the Homebrew tap.
#     It is the usual release while zslice is in beta.
#   - Any other suffix (v0.6.0-rc1, v0.6.0-test) is a prerelease, and the
#     tap does not change.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must exist)"
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The Windows jobs run only when the tag has windows/.
  meta:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.windows.outputs.exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - id: windows
        run: |
          if [ -d windows ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  # The command line tool, the C library, and the web app. Zig builds all
  # of them on one Linux runner.
  cli:
    name: CLI, library, and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test
        run: zig build test

      - name: Build
        run: |
          set -eu
          mkdir -p dist
          for t in x86_64-linux-musl aarch64-linux-musl aarch64-macos x86_64-macos; do
            zig build -Dtarget="$t" -Doptimize=ReleaseFast --prefix "out/$t"
            name="zslice-${TAG#v}-$t"
            mkdir -p "pkg/$name"
            cp "out/$t/bin/zslice" LICENSE README.md "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          # The C library for printer hosts (printdeck links it with cgo):
          # libzslice.a and the headers, static only. The glibc of aarch64
          # is 2.36, so it links on older systems too.
          for t in aarch64-linux-gnu.2.36 x86_64-linux-gnu.2.36; do
            zig build lib -Dtarget="$t" -Doptimize=ReleaseFast --prefix "out/lib-$t"
            arch="${t%%.*}"
            name="zslice-${TAG#v}-lib-$arch"
            mkdir -p "pkg/$name/lib" "pkg/$name/include"
            cp "out/lib-$t/lib/libzslice.a" "pkg/$name/lib/"
            cp include/zslice.h include/zslice-app.h "pkg/$name/include/"
            cp LICENSE "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done

      # The web app of zig build web, in a folder of static files.
      - name: Build the web app
        run: |
          set -eu
          zig build web
          name="zslice-${TAG#v}-web"
          mkdir -p "pkg/$name"
          cp -r zig-out/web/app/. "pkg/$name/"
          cp LICENSE "pkg/$name/"
          (cd pkg && zip -qr "../dist/$name.zip" "$name")

      # The x86_64 Linux tool slices a 20 mm cube. The web app slices a
      # box in Node.js (test-node.mjs paints the part over z = 40 mm).
      - name: Check
        run: |
          set -eu
          tar -xzf "dist/zslice-${TAG#v}-x86_64-linux-musl.tar.gz" -C "$RUNNER_TEMP"
          python3 -I tools/cube_stl.py "$RUNNER_TEMP/cube.stl"
          "$RUNNER_TEMP/zslice-${TAG#v}-x86_64-linux-musl/zslice" slice "$RUNNER_TEMP/cube.stl" -o "$RUNNER_TEMP/cube.gcode"
          grep -q ";LAYER:" "$RUNNER_TEMP/cube.gcode"
          python3 -I tools/cube_stl.py "$RUNNER_TEMP/box.stl" 30 30 48
          node web/app/test-node.mjs zig-out/web/app/zslice.wasm "$RUNNER_TEMP/box.stl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/*

  # The Linux app: a tarball of the install folder (bin/zslice-gtk and
  # share/). Each architecture builds on its own runner with the GTK
  # packages of Ubuntu 24.04. The core is for a baseline CPU.
  linux:
    name: Linux app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libsoup-3.0-dev libjson-glib-dev libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            meson ninja-build
      - name: Build
        working-directory: linux
        env:
          ZSLICE_CORE_CPU: baseline
        run: |
          meson setup build --buildtype=release --prefix=/ -Dwerror=true
          ninja -C build
          DESTDIR="$PWD/dist" meson install -C build
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          name="zslice-gtk-${TAG#v}-linux-$ARCH"
          # bin and share only: meson install runs zig build again, and
          # zig puts the core (core-prefix) under DESTDIR too.
          mkdir -p "pkg/$name"
          cp -a linux/dist/bin linux/dist/share "pkg/$name/"
          cp LICENSE "pkg/$name/"
          test -x "pkg/$name/bin/zslice-gtk"
          test -d "pkg/$name/share/zslice/beds"
          mkdir -p dist
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # The Mac app: macos/release.sh builds it for arm64 and x86_64, signs it
  # with the Developer ID, and notarizes and staples the app and the dmg.
  # With no signing secrets, it makes an unsigned dmg.
  macos:
    name: Mac app
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # A new keychain for this run with the Developer ID Application
      # certificate. It is on the search list, so codesign finds the
      # identity by its name.
      - name: Import the certificate
        if: env.HAVE_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build, sign, and notarize
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          if [ "$HAVE_CERT" = true ]; then
            export APPLE_TEAM_ID="$TEAM_ID"
            NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_FILE"
            export NOTARY_KEY_FILE
          else
            echo "::warning::MACOS_CERT_P12 is not set: the Mac app is not signed or notarized"
          fi
          macos/release.sh "${TAG#v}" "$GITHUB_RUN_NUMBER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: macos/build/zslice-*.dmg

  # The Windows app, when the tag has windows/. It is not signed: there is
  # no Windows certificate yet, so SmartScreen warns at the first start.
  # The x64 runner builds ARM64 as a cross build.
  windows:
    name: Windows app (${{ matrix.platform }})
    needs: meta
    if: needs.meta.outputs.windows == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      # The ARM64 build needs the ARM64 tools of MSVC. The step adds them
      # when the Visual Studio of the runner does not have them.
      - name: Add the ARM64 tools
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $has = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $has) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          }
      # The core goes to zig-out\windows-x64 or zig-out\windows-arm64.
      - name: Build the core
        run: pwsh windows/build-core.ps1 -Configuration Release -Platform ${{ matrix.platform }}
      # The app project is not in the repository yet. The step builds the
      # first .sln (else .vcxproj) in windows/, and zips the output folder
      # windows/<platform>/Release.
      - name: Build and package
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $proj = Get-ChildItem windows -Filter *.sln | Select-Object -First 1
          if (-not $proj) { $proj = Get-ChildItem windows -Filter *.vcxproj | Select-Object -First 1 }
          if (-not $proj) { throw 'no .sln or .vcxproj in windows/' }
          msbuild $proj.FullName -t:Restore /p:Configuration=Release /p:Platform=$env:PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=$env:PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path windows "$env:PLATFORM\Release"
          if (-not (Test-Path $out)) { throw "no output folder $out" }
          $version = $env:TAG -replace '^v', ''
          $arch = $env:PLATFORM.ToLowerInvariant()
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "dist\zslice-$version-windows-$arch.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.platform }}
          path: dist/*

  # The GitHub release: the files of all jobs, SHA256SUMS, and the notes of
  # tools/release_notes.py. A second run of the same tag replaces the files
  # and the notes. A skipped Windows job does not stop the release.
  publish:
    name: Release
    needs: [cli, linux, macos, windows]
    if: ${{ !cancelled() && needs.cli.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS) | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I tools/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "zslice $TAG" --notes-file "$RUNNER_TEMP/notes.md" $pre
          fi

  # The Homebrew tap (beetlebugorg/homebrew-tap): the formulas zslice and
  # zslice-gtk, and the cask zslice when the dmg is signed. Only for vX.Y.Z
  # and vX.Y.Z-beta.
  homebrew:
    name: Homebrew tap
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Without the token the release stays, and the tap keeps the version
      # before it.
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$'; then
            echo "$TAG is not a release for the tap"
            exit 0
          fi
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the tap is not updated"
            exit 0
          fi
          v="${TAG#v}"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap" "$RUNNER_TEMP/tap"
          sh packaging/homebrew/tap.sh "$v" dist "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zslice.rb Formula/zslice-gtk.rb
          if [ -f Casks/zslice.rb ]; then git add Casks/zslice.rb; fi
          git diff --cached --quiet || git commit -m "zslice $v"
          git push

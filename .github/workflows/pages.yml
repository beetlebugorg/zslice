name: Pages

# The site of zslice.beetlebug.org: the web app at the root, and the docs
# (docs.html and the page folders) next to it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "web/**"
      - "include/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The web app: zig build web writes it to zig-out/web/app.
      - run: zig build web

      # docs/build.py writes the pages of docs/, and the pages are in the
      # repository. The site is the docs folder, with the web app on top.
      - run: |
          mkdir site
          cp -r docs/. site/
          cp -r zig-out/web/app/. site/
          test -f site/index.html && test -f site/zslice.wasm && test -f site/docs.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The zslice icon: a Z drawn as print lines; the first layer is orange.
       SPDX-License-Identifier: AGPL-3.0-or-later -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- A light rim, so the icon keeps its edge on a dark background. -->
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="12"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="96">
    <path d="M262 270 H762 L262 754" stroke="#f4f0e6"/>
    <path d="M262 754 H762" stroke="#ff5a1f"/>
  </g>
</svg>

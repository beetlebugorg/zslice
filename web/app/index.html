<!doctype html>
<!-- The zslice web app: the same window as the GTK shell (linux/), as a
     single page. See README.md. SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zslice</title>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <header class="headerbar">
    <div class="hb-start">
      <button id="open" class="hb-button icon" title="Open a model, or add models to this plate (Ctrl+O opens)" aria-label="Open or add models">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 2.5h7l3 3v8H3z M9.5 2.5v3.5h3.5 M5.5 8.5h5 M5.5 11h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div id="title" class="hb-title">zslice</div>
    </div>
    <!-- The search: a field in the header, with its results under it. The
         undock button makes it a card over the view (search.js); then a
         Search button opens the card. The 2D view has a key (2) and an
         item of the main menu. -->
    <div class="hb-center toolbar">
      <div id="search-field" class="search-field" role="search" title="Search settings and actions (/). Change a setting right in the results, and watch the slice.">
        <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6l3.4 3.4"/></svg>
        <span id="search-scope" class="search-scope" hidden></span>
        <input id="search-input" class="search-input" type="text" placeholder="Search settings and actions" spellcheck="false" autocomplete="off" aria-label="Search settings and actions">
        <kbd class="search-kbd">/</kbd>
        <button id="search-close" class="flat icon search-close" hidden title="Close the search (Esc)" aria-label="Close the search">×</button>
        <button id="search-undock" class="flat icon search-undock" title="Undock the search: a card over the view that you can move and resize" aria-label="Undock the search">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v9h-11zM2.5 6.5h11"/></svg>
        </button>
      </div>
      <button id="search-open" class="tool search-button" hidden title="Search settings and actions (/). Change a setting right in the results, and watch the slice." aria-label="Search settings and actions">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6l3.4 3.4"/></svg>
        <span class="search-word">Search</span><kbd>/</kbd>
      </button>
      <span id="gap-count" class="dim gap-count" hidden></span>
    </div>
    <div class="hb-end">
      <!-- The setup of the print: the printer, the filament, and the
           quality, as one group. -->
      <div class="setup" role="group" aria-label="The printer, the filament, and the quality">
        <button id="printer-menu" class="hb-button setup-part" title="The printer">Printer</button>
        <button id="filament-menu" class="hb-button setup-part" title="The filament">Filament</button>
        <button id="quality-menu" class="hb-button setup-part" title="The quality">custom</button>
      </div>
      <button id="printers-page" class="hb-button icon" title="Printers: your printers, their jobs, and the plates to print" aria-label="Printers">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4.5 6V2.5h7V6M4.5 11.5h-2v-5.5h11v5.5h-2M4.5 9.5h7v4h-7z"/></svg>
      </button>
      <button id="panel-toggle" class="hb-button icon" title="All settings (N)" aria-label="Show the panel" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h2M7.5 11.5h6M11 3v3M6 10v3"/></svg>
      </button>
      <button id="main-menu" class="hb-button icon" title="Main menu" aria-label="Main menu">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </header>

  <main class="window">
    <section id="preview" class="preview">
      <canvas id="gl" tabindex="0"></canvas>
      <div class="float toolstrip" role="toolbar" aria-label="Tools" aria-orientation="vertical">
          <button id="tool-select" class="tool icon" data-key="V" title="Select (V): click a line to see what it is, its measurements, and the settings that change it." aria-label="Select">
            <svg viewBox="0 0 18 18" width="18" height="18"><path d="M5 2v13l3.2-3 2.3 4.5 2.1-1-2.3-4.5h4.2z" fill="currentColor"/></svg>
          </button>
          <button id="tool-move" class="tool icon" data-key="M" title="Move (M): drag a part to move it, and turn the mouse wheel to turn it. Ctrl does the same in the other tools." aria-label="Move">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h14M9 2v14M13.7 6.8 16 9l-2.3 2.2M4.3 6.8 2 9l2.3 2.2M6.8 4.3 9 2l2.2 2.3M6.8 13.7 9 16l2.2-2.3"/></svg>
          </button>
          <button id="tool-turn" class="tool icon" data-key="R" title="Turn (R): click a part, then drag one of its rings to turn it about X (red), Y (green), or Z (blue), in steps of 15°. Keys: Left and Right (about Z), Up and Down (about X), Page Up and Page Down (about Y); Shift: 5°." aria-label="Turn">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2.2v3.3h-3.3"/></svg>
          </button>
          <button id="tool-support" class="tool icon" data-key="S" title="Support (S; S again opens or closes its pane): point at an overhang, and click to put support under it. Alt and a click draw an area point by point; click the first point (or press Enter) to close it. Support grows under the area, or Block keeps support out. Click an outline to select it, and drag its points. Shift: no snap. Tree support: drag a dot of a tree to move it, its ring to make it wider, a segment to move the branch; Delete removes a branch." aria-label="Support">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2 4.5h14l-2 3H4z"/><path d="M5 7.5v8M9 7.5v8M13 7.5v8M3.5 15.5h11"/></svg>
          </button>
          <button id="tool-grab" class="tool icon" data-key="G" title="Grab (G): click a part to pick it up; move the pointer to carry it. The wheel lifts it; Alt and a move turn it (Shift: steps of 15°). Click again, or press Esc, to let go: with support off it falls and rests flat; with support on it keeps its turn, and support holds it." aria-label="Grab">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4.2a1.2 1.2 0 0 1 2.4 0V8M8.4 7.5V3.2a1.2 1.2 0 0 1 2.4 0V8M10.8 7.6V4.2a1.2 1.2 0 0 1 2.4 0v6.3c0 3-2 5-4.8 5-2 0-3-.9-4.2-2.6L2.6 10a1.2 1.2 0 0 1 2-1.3L6 10.4"/></svg>
          </button>
          <button id="tool-measure" class="tool icon" data-key="T" title="Measure (T): click two points of the print. The ends of the lines snap; Shift turns the snap off. A circle or an arc gives its size. Esc clears." aria-label="Measure">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><g transform="rotate(-45 9 9)"><rect x="1" y="6" width="16" height="6" rx="0.5"/><path d="M4 6v2.5M6.5 6v1.5M9 6v2.5M11.5 6v1.5M14 6v2.5"/></g></svg>
          </button>
          <button id="tool-paint" class="tool icon" data-key="P" title="Paint (P): paint filaments on the surface of a part. Smart select: click a raised letter, a logo, or a face; Shift adds more. Brush: drag over the surface." aria-label="Paint">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5a6.5 6.5 0 1 0 0 13c1 0 1.5-.6 1.5-1.3 0-1-.9-1.2-.9-2s.6-1.2 1.4-1.2h1.6a2.9 2.9 0 0 0 2.9-2.9C15.5 5 12.6 2.5 9 2.5z"/><circle cx="5.6" cy="8.4" r="1" fill="currentColor"/><circle cx="7.6" cy="5.4" r="1" fill="currentColor"/><circle cx="11" cy="5.4" r="1" fill="currentColor"/></svg>
          </button>
          <button id="tool-label" class="tool icon" data-key="E" title="Label (E): click a face of a part to put text or marks on it, in another filament. Drag a label to move it (Shift: keep its plane), turn the wheel over it to turn it (Shift: 15°), and drag its corner to scale it." aria-label="Label">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.5" width="14" height="11" rx="1.5"/><path d="M5.5 7h5M8 7v4.5M12 11.5h1.2"/></svg>
          </button>
        <div class="strip-sep" role="separator"></div>
        <button id="colors" class="tool icon" title="The colors of the lines" aria-label="The colors of the lines">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="3.5" cy="4.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="13.5" r="1.3" fill="currentColor" stroke="none"/><path d="M7 4.5h8M7 9h8M7 13.5h8"/></svg>
        </button>
        <button id="gaps" class="tool icon" disabled aria-label="Gaps">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="5.5" height="5.5"/><rect x="10" y="10" width="5.5" height="5.5"/><path d="M10 2.5h5.5V8" stroke-dasharray="1.6 1.6"/></svg>
        </button>
        <button id="check" class="tool icon" disabled aria-label="Check the print">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5l3.5 3.5 7.5-8.5"/></svg>
        </button>
      </div>
      <div id="measure-readout" class="float measure-readout" hidden></div>
      <!-- In the 2D view: a sign at the top of the view. A click on it
           shows the 3D view. -->
      <button id="view-sign" class="float view-sign" hidden title="The 2D layer view: one layer from the top. Click here, or press 2, for the 3D view.">2D view</button>
      <div id="legend" class="float legend" hidden></div>
      <div id="layers" class="layers" hidden>
        <div class="trough"><div class="highlight"></div></div>
        <div class="knob hi" tabindex="0"></div>
        <div class="knob lo" tabindex="0"></div>
        <div class="bubble hi"></div>
        <div class="bubble lo" hidden></div>
      </div>
      <!-- One bar at the bottom, the full width of the view, in one row:
           the plates, undo, redo, and history, the replay of the print,
           and the print. -->
      <div id="dock" class="float dock">
      <div id="plate-bar" class="float plate-bar">
        <button id="plate-prev" class="tool icon" title="The plate before ([)" aria-label="The plate before">‹</button>
        <span id="plate-name" class="pb-name">Plate 1 of 1</span>
        <button id="plate-next" class="tool icon" title="The next plate (])" aria-label="The next plate">›</button>
        <button id="plate-all" class="tool" title="Show all plates (Home). F shows the active plate.">All</button>
        <button id="plate-add" class="tool" title="Add an empty plate after the others">+ Plate</button>
        <button id="plate-remove" class="tool icon" title="Remove this plate" aria-label="Remove this plate">×</button>
      </div>
      <!-- Undo, redo, and the history. The history button opens the list
           of the changes over it. Its count is the changes since you
           opened or saved. -->
      <div id="hist-tools" class="float hist-tools" role="group" aria-label="Undo and history">
        <button id="undo" class="tool icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 3 7l3.5 3.5"/><path d="M3 7h7.5a4.5 4.5 0 0 1 0 9H8"/></svg>
        </button>
        <button id="redo" class="tool icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 3.5 15 7l-3.5 3.5"/><path d="M15 7H7.5a4.5 4.5 0 0 0 0 9H10"/></svg>
        </button>
        <button id="history-button" class="tool icon hist-button" title="History (Ctrl+H)" aria-label="History" aria-haspopup="dialog" aria-expanded="false" aria-controls="history-pop">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 9a5.8 5.8 0 1 0 1.7-4.1"/><path d="M4.9 1.9v3h3"/><path d="M9 5.8V9l2.3 1.5"/></svg>
          <span id="history-count" class="hist-count" aria-hidden="true" hidden></span>
        </button>
      </div>
      <div id="scrub" class="float scrub" hidden>
        <button id="play" class="tool icon" title="Replay the print">
          <svg viewBox="0 0 16 16" width="14" height="14"><path id="play-icon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <button id="speed" class="tool menu-button" title="The replay speed">10×</button>
        <input id="scrub-range" type="range" min="0" max="1" step="0.001" value="1">
        <span id="scrub-label" class="scrub-label"></span>
      </div>
        <!-- The print: its time, the details pane, and Print or Export. -->
        <div id="summary" class="summary dock-summary" aria-label="The print">
          <button id="sum-more" class="sum-head" title="The details of the print" aria-expanded="false" aria-controls="sum-pop">
            <span id="sum-time" class="sum-time">—</span>
            <span id="sum-detail" class="dim sum-detail"></span>
            <span id="sum-badge" class="sum-badge" hidden></span>
          </button>
          <div id="sum-pop" class="float sum-pop" role="dialog" aria-label="The details of the print" hidden>
            <div id="sum-cam" class="sum-cam" aria-label="The print on the printer" hidden></div>
            <div id="sum-facts" class="sum-facts" aria-label="The main settings of the print"></div>
            <div id="sum-took" class="dim sum-took"></div>
            <div id="sum-warn" class="sum-warn" role="alert" hidden></div>
            <div id="refine-tips" class="refine-tips" aria-label="Your usual refinements" hidden></div>
            <div id="sum-project" class="dim sum-project" hidden></div>
          </div>
          <div id="sum-progress" class="progress" hidden><div></div></div>
          <div id="send-box" class="send-box" hidden>
            <button id="send" class="suggested" disabled>Print</button>
            <button id="send-menu" class="suggested menu-button" title="More: upload only, or export a file" aria-label="More"></button>
          </div>
          <button id="export" class="suggested" disabled>Export G-code…</button>
        </div>
      </div>
      <!-- An empty plate: a small Open button on the plate (app.js
           placeOpenButton moves it with the plate). -->
      <div id="empty" class="empty">
        <button id="empty-open" class="plate-open" title="Open a model on this plate. You can also drop an STL or 3MF file on the view.">Open a model</button>
      </div>
      <!-- The work that runs (the draft slice, the exact slice, the
           simulated print): a thin bar at the top edge of the view, and a
           dim line of text. Both take no clicks. -->
      <div id="work" class="work" aria-hidden="true"><div id="work-fill"></div></div>
      <div id="busy" class="busy" role="status"></div>
      <div id="toast" class="toast" hidden></div>
      <!-- The history: a popover over its button in the dock (app.js
           placeHistory puts it there). -->
      <div id="history-pop" class="float history-pop" role="dialog" aria-label="History" hidden>
        <div class="hist-pop-head">
          <span class="panel-title">History</span>
          <span id="history-sum" class="dim hist-sum"></span>
          <button id="history-close" class="flat icon" title="Close (Esc)" aria-label="Close">×</button>
        </div>
        <div id="page-history" class="page"></div>
      </div>
      <!-- The printers: a page of its own over the view. -->
      <div id="farm-view" class="farm-view" hidden>
        <div class="page-bar">
          <button id="farm-back" class="pill">‹ Back to the plate</button>
        </div>
        <div id="page-farm" class="page"></div>
      </div>
    </section>
    <dialog id="project-dialog" class="project-dialog" aria-label="Open a project">
      <div class="page-bar"><span class="panel-title">Project</span><button id="project-close" class="flat icon" aria-label="Close">×</button></div>
      <div id="page-project" class="page"></div>
    </dialog>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Drag to change the width of the panel. A double click sets it back."></div>
    <aside id="panel" class="panel">
      <!-- One row: the back arrow and the place in the settings (or the
           selected line), Pin, and close. -->
      <div class="panel-top">
        <button id="crumb-back" class="flat icon" title="Back">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="selected-back" class="flat icon" title="Back to the settings" aria-label="Back to the settings" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div id="crumbs" class="crumbs"></div>
        <div id="panel-title" class="panel-title" hidden>Selected line</div>
        <button id="panel-pin" class="flat panel-pin" title="Pin the panel beside the view, or let it slide over the view" aria-pressed="false">Pin</button>
        <button id="panel-close" class="flat icon" title="Hide the panel (N, or Esc)" aria-label="Hide the panel">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div id="page-settings" class="page">
        <div class="searchbar">
          <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3"/></svg>
          <input id="search" type="search" placeholder="Search settings" autocomplete="off">
        </div>
        <div id="columns" class="columns">
          <div id="col-sections" class="column"></div>
          <div id="col-settings" class="column" hidden></div>
          <div id="col-detail" class="column detail" hidden></div>
        </div>
      </div>
      <div id="page-selected" class="page" hidden></div>
      <nav class="panel-foot" aria-label="About zslice">
        <a href="https://zslice.beetlebug.org/docs.html" target="_blank" rel="noopener">Docs</a>
        <span aria-hidden="true">·</span>
        <a href="https://zslice.beetlebug.org/privacy/" target="_blank" rel="noopener" title="No analytics, no cookies. Your models and settings stay in your browser.">Privacy: your files stay in your browser</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/beetlebugorg/zslice" target="_blank" rel="noopener" title="zslice is free software under the AGPL-3.0-or-later">Source code (AGPL)</a>
      </nav>
    </aside>
  </main>
  <div id="menu-layer" class="menu-layer" hidden></div>
  <input id="file" type="file" accept=".stl,.STL,.3mf,.3MF,.obj,.OBJ,.step,.STEP,.stp,.STP,model/stl,model/3mf,model/obj,model/step" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>

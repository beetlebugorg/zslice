<!doctype html>
<!-- The zslice web app: the same window as the GTK shell (linux/), as a
     single page. See README.md. SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zslice</title>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <header class="headerbar">
    <div class="hb-start">
      <button id="open" class="hb-button icon" title="Open a model (Ctrl+O)" aria-label="Open">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 2.5h7l3 3v8H3z M9.5 2.5v3.5h3.5 M5.5 8.5h5 M5.5 11h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="printer-menu" class="hb-button menu-button">Printer</button>
      <button id="filament-menu" class="hb-button menu-button">Filament</button>
      <button id="quality-menu" class="hb-button menu-button">Quality: custom</button>
    </div>
    <div id="title" class="hb-title">zslice</div>
    <div class="hb-end">
      <button id="panel-toggle" class="hb-button icon" title="All settings, the selected line, the history, and the project (N)" aria-label="Show the panel" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h2M7.5 11.5h6M11 3v3M6 10v3"/></svg>
      </button>
      <button id="main-menu" class="hb-button icon" title="Main menu" aria-label="Main menu">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </header>

  <main class="window">
    <section id="preview" class="preview">
      <canvas id="gl" tabindex="0"></canvas>
      <div class="float toolbar">
        <div class="linked">
          <button id="view-2d" class="tool">2D</button>
          <button id="view-3d" class="tool checked">3D</button>
        </div>
        <button id="search-open" class="tool search-button" title="Search settings and actions (/). Change a setting right in the results, and watch the slice." aria-label="Search settings and actions">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6l3.4 3.4"/></svg>
          <span class="search-word">Search</span><kbd>/</kbd>
        </button>
        <button id="colors" class="tool menu-button" title="The colors of the lines">Filament</button>
        <button id="play" class="tool icon" title="Replay the print">
          <svg viewBox="0 0 16 16" width="14" height="14"><path id="play-icon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <button id="speed" class="tool menu-button" title="The replay speed">10×</button>
        <button id="isolate" class="tool" hidden title="Show only the selected line solid, and the other lines as faint ghosts">Fade others</button>
        <button id="gaps" class="tool" disabled>Gaps</button>
        <span id="gap-count" class="dim gap-count" hidden></span>
        <button id="check" class="tool menu-button" disabled>Check</button>
        <button id="add" class="tool icon" title="Open a model">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="float toolstrip" role="toolbar" aria-label="Tools" aria-orientation="vertical">
          <button id="tool-select" class="tool icon" data-key="S" title="Select (S): click a line to see what it is, its measurements, and the settings that change it." aria-label="Select">
            <svg viewBox="0 0 18 18" width="18" height="18"><path d="M5 2v13l3.2-3 2.3 4.5 2.1-1-2.3-4.5h4.2z" fill="currentColor"/></svg>
          </button>
          <button id="tool-move" class="tool icon" data-key="M" title="Move (M): drag a part to move it, and turn the mouse wheel to turn it. Ctrl does the same in the other tools." aria-label="Move">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h14M9 2v14M13.7 6.8 16 9l-2.3 2.2M4.3 6.8 2 9l2.3 2.2M6.8 4.3 9 2l2.2 2.3M6.8 13.7 9 16l2.2-2.3"/></svg>
          </button>
          <button id="tool-measure" class="tool icon" data-key="T" title="Measure (T): click two points of the print. The ends of the lines snap; Shift turns the snap off. A circle or an arc gives its size. Esc clears." aria-label="Measure">
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><g transform="rotate(-45 9 9)"><rect x="1" y="6" width="16" height="6" rx="0.5"/><path d="M4 6v2.5M6.5 6v1.5M9 6v2.5M11.5 6v1.5M14 6v2.5"/></g></svg>
          </button>
      </div>
      <div id="measure-readout" class="float measure-readout" hidden></div>
      <div id="legend" class="float legend" hidden></div>
      <div id="layers" class="layers" hidden>
        <div class="trough"><div class="highlight"></div></div>
        <div class="knob hi" tabindex="0"></div>
        <div class="knob lo" tabindex="0"></div>
        <div class="bubble hi"></div>
        <div class="bubble lo" hidden></div>
      </div>
      <div id="timeline" class="float timeline" tabindex="0" hidden></div>
      <div id="scrub" class="float scrub" hidden>
        <input id="scrub-range" type="range" min="0" max="1" step="0.001" value="1">
        <span id="scrub-label" class="scrub-label"></span>
      </div>
      <div id="empty" class="empty">
        <div class="empty-title">Open a model</div>
        <div class="empty-text">Drop an STL or 3MF file here, or click Open.</div>
        <button id="empty-open" class="pill">Open…</button>
      </div>
      <div id="summary" class="summary float-card" aria-label="The print">
        <div id="sum-time" class="sum-time">—</div>
        <div id="sum-detail" class="dim sum-detail"></div>
        <div id="sum-facts" class="sum-facts" aria-label="The main settings of the print"></div>
        <div id="sum-took" class="dim sum-took"></div>
        <div id="sum-progress" class="progress" hidden><div></div></div>
        <div id="send-box" class="send-box" hidden>
          <button id="send" class="suggested" disabled>Print</button>
          <button id="send-menu" class="suggested menu-button" title="More: upload only, or export a file" aria-label="More"></button>
        </div>
        <button id="export" class="suggested" disabled>Export G-code…</button>
      </div>
      <div id="busy" class="busy" hidden>Slicing…</div>
      <div id="toast" class="toast" hidden></div>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Drag to change the width of the panel. A double click sets it back."></div>
    <aside id="panel" class="panel">
      <div class="panel-top">
        <button id="panel-back" class="flat icon" title="Back (Alt+Left)" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="switcher" role="tablist">
          <button id="tab-settings" class="checked" role="tab">Settings</button>
          <button id="tab-selected" role="tab">Selected</button>
          <button id="tab-history" role="tab">History</button>
          <button id="tab-project" role="tab" title="A printdeck.yml project: its parts and plates">Project</button>
        </div>
        <button id="panel-pin" class="flat panel-pin" title="Pin the panel beside the view, or let it slide over the view" aria-pressed="false">Pin</button>
        <button id="panel-close" class="flat icon" title="Hide the panel (N, or Esc)" aria-label="Hide the panel">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div id="page-settings" class="page">
        <div class="crumbbar">
          <button id="crumb-back" class="flat icon" title="Back">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <div id="crumbs" class="crumbs"></div>
        </div>
        <div class="scopebar">
          <span class="dim">Settings for</span>
          <button class="dropdown" disabled title="Settings for one part are not in the web app yet">This print (all parts)</button>
        </div>
        <div class="searchbar">
          <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3"/></svg>
          <input id="search" type="search" placeholder="Search settings" autocomplete="off">
        </div>
        <div id="columns" class="columns">
          <div id="col-sections" class="column"></div>
          <div id="col-settings" class="column" hidden></div>
          <div id="col-detail" class="column detail" hidden></div>
        </div>
      </div>
      <div id="page-selected" class="page" hidden></div>
      <div id="page-history" class="page" hidden></div>
      <div id="page-project" class="page" hidden></div>
      <nav class="panel-foot" aria-label="About zslice">
        <a href="https://zslice.beetlebug.org/docs.html" target="_blank" rel="noopener">Docs</a>
        <span aria-hidden="true">·</span>
        <a href="https://zslice.beetlebug.org/privacy/" target="_blank" rel="noopener" title="No analytics, no cookies. Your models and settings stay in your browser.">Privacy: your files stay in your browser</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/beetlebugorg/zslice" target="_blank" rel="noopener" title="zslice is free software under the AGPL-3.0-or-later">Source code (AGPL)</a>
      </nav>
    </aside>
  </main>
  <div id="menu-layer" class="menu-layer" hidden></div>
  <input id="file" type="file" accept=".stl,.STL,.3mf,.3MF,model/stl,model/3mf" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
